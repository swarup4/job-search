[project]
name = "jobpilot-ai"
version = "1.0.0"
description = "JobPilot AI tier — LLM rectification, RAG, agents and MCP tool servers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.0",
    "markdownify>=1.2.3",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.53.0",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.168.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# The live suite drives the real local model; run it with `pytest -m llm`.
addopts = "-m 'not llm'"
markers = ["llm: needs the local Ollama model from ai/.env (slow; run with -m llm)"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "agents*", "mcp_servers*", "rag*", "sources*", "api*"]
